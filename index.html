    <script>
        // ============== Firebase配置 ==============
        // 请将您的Firebase配置信息填入此处
        const firebaseConfig = {
            apiKey: "AIzaSyCU0n3M8gnNQDTmZN9lBOky0dQvoabWXgg",
            authDomain: "novel-portfolio.firebaseapp.com",
            projectId: "novel-portfolio",
            storageBucket: "novel-portfolio.firebasestorage.app",
            messagingSenderId: "151525086956",
            appId: "1:151525086956:web:a0b7f6dd233c1d2ad377c9"
        };

        // 初始化Firebase
        let app, db, auth;
        const storageEnabled = false; // 禁用Storage，只用Base64方式
        try {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (e) {
            // Firebase未配置，显示提示
            setTimeout(() => {
                document.getElementById('firebase-config-hint').style.display = 'flex';
            }, 500);
        }

        // ============== 全局变量 ==============
        let novelList = [];
        let typeList = ['追妻火葬场', '世情爽文'];
        let currentUser = null;
        let currentTypeFilter = 'all';
        let currentPlatformFilter = 'all';
        let currentSearchQuery = '';
        let isViewOnlyMode = false;
        let isAdmin = false;

        // 便捷变量
        const cardList = document.getElementById('card-list');
        const modal = document.getElementById('modal');
        const shareModal = document.getElementById('share-modal');
        const typeModal = document.getElementById('type-modal');
        const adminModal = document.getElementById('admin-modal');

        // ============== 2. 视觉特效 ==============
        function createPetals() {
            const container = document.getElementById('petals');
            const colors = ['#e4b4b4', '#d4a4a4', '#c49494', '#b48484'];
            
            for (let i = 0; i < 20; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = `${Math.random() * 100}%`;
                petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                petal.style.animationDuration = `${6 + Math.random() * 8}s`;
                petal.style.animationDelay = `${Math.random() * 6}s`;
                petal.style.opacity = Math.random() * 0.6 + 0.2;
                petal.style.width = `${6 + Math.random() * 6}px`;
                petal.style.height = `${10 + Math.random() * 10}px`;
                container.appendChild(petal);
            }
        }

        function createStars() {
            const container = document.getElementById('headerStars');
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDuration = `${3 + Math.random() * 4}s`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(star);
            }
        }

        function createDynamicStars() {
            const container = document.getElementById('dynamicStars');
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('div');
                star.className = 'dynamic-star';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.width = `${2 + Math.random() * 3}px`;
                star.style.height = star.style.width;
                star.style.animationDuration = `${2 + Math.random() * 4}s`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(star);
            }
        }

        function initMouseFollower() {
            const follower = document.getElementById('mouseFollower');
            let x = 0, y = 0;
            let mouseX = 0, mouseY = 0;

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX - 10;
                mouseY = e.clientY - 10;
            });

            function animate() {
                x += (mouseX - x) * 0.1;
                y += (mouseY - y) * 0.1;
                follower.style.left = `${x}px`;
                follower.style.top = `${y}px`;
                requestAnimationFrame(animate);
            }
            animate();
        }

        function hideLoadingBar() {
            const bar = document.querySelector('.loading-bar');
            setTimeout(() => {
                bar.style.opacity = '0';
                setTimeout(() => bar.style.display = 'none', 300);
            }, 1500);
        }

        // ============== 用户认证相关 ==============
        function switchAuthTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'login') {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                alert('✅ 登录成功！');
                // 登录成功后切换到主页面
                document.getElementById('auth-page').style.display = 'none';
                document.getElementById('main-header').style.display = 'block';
                document.getElementById('main-content').style.display = 'block';
            } catch (error) {
                alert('❌ 登录失败：' + error.message);
            }
        }

        async function handleRegister() {
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const inviteCode = document.getElementById('register-invite-code').value;
            
            try {
                // 验证邀请码
                const inviteRef = db.collection('inviteCodes').doc(inviteCode);
                const inviteDoc = await inviteRef.get();
                
                if (!inviteDoc.exists || !inviteDoc.data().active) {
                    alert('❌ 邀请码无效或已过期！');
                    return;
                }
                
                // 创建用户
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // 设置用户资料
                await user.updateProfile({ displayName: name });
                
                // 保存用户信息到Firestore
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    email: email,
                    displayName: name,
                    role: 'user',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // 使用邀请码
                await inviteRef.update({
                    active: false,
                    usedBy: user.uid,
                    usedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert('✅ 注册成功！');
                // 注册成功后切换到主页面
                document.getElementById('auth-page').style.display = 'none';
                document.getElementById('main-header').style.display = 'block';
                document.getElementById('main-content').style.display = 'block';
            } catch (error) {
                alert('❌ 注册失败：' + error.message);
            }
        }

        function handleLogout() {
            auth.signOut();
            // 注销后显示登录页，隐藏主页面
            document.getElementById('main-header').style.display = 'none';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('auth-page').style.display = 'block';
        }

        function updateUserInfoUI() {
            const container = document.getElementById('user-info-container');
            if (currentUser) {
                const isAdminBadge = isAdmin ? '<span style="color:#e4b4b4;">👑</span>' : '';
                container.innerHTML = `
                    <div class="user-info">
                        <div class="user-avatar">${currentUser.displayName ? currentUser.displayName[0] : 'U'}</div>
                        <span class="user-name">${isAdminBadge} ${currentUser.displayName || currentUser.email}</span>
                        ${isAdmin ? '<button class="btn btn-edit" onclick="openAdminModal()" style="padding:6px 12px;font-size:0.8rem;">管理</button>' : ''}
                        <button class="logout-btn" onclick="handleLogout()">退出</button>
                    </div>
                `;
            } else {
                container.innerHTML = '';
            }
        }

        // ============== 管理员后台 ==============
        async function openAdminModal() {
            await loadUsers();
            await loadInviteCodes();
            adminModal.style.display = 'flex';
        }

        function closeAdminModal() {
            adminModal.style.display = 'none';
        }

        async function loadUsers() {
            const users = await db.collection('users').get();
            const container = document.getElementById('user-list');
            let html = '';
            users.forEach(doc => {
                const user = doc.data();
                html += `
                    <div class="user-item">
                        <div class="user-item-info">${user.displayName} (${user.email})</div>
                        <div class="user-item-actions">
                            ${user.role !== 'admin' ? `<button class="btn btn-edit" onclick="promoteUser('${doc.id}')">设为管理员</button>` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function promoteUser(uid) {
            if (confirm('确定要将该用户设为管理员吗？')) {
                await db.collection('users').doc(uid).update({ role: 'admin' });
                await loadUsers();
            }
        }

        async function loadInviteCodes() {
            const codes = await db.collection('inviteCodes').get();
            const container = document.getElementById('invite-code-list');
            let html = '';
            codes.forEach(doc => {
                const code = doc.data();
                html += `
                    <div class="invite-code-item">
                        <span style="color:var(--rose-light);">${doc.id}</span>
                        <span class="code-status ${code.active ? 'active' : 'inactive'}">${code.active ? '可用' : '已使用'}</span>
                        ${code.active ? `<button class="btn btn-delete" onclick="revokeInviteCode('${doc.id}')">撤销</button>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function generateInviteCode() {
            return 'R' + Math.random().toString(36).substr(2, 8).toUpperCase();
        }

        async function addInviteCode() {
            const customCode = document.getElementById('new-invite-code').value.trim();
            const code = customCode || generateInviteCode();
            
            try {
                await db.collection('inviteCodes').doc(code).set({
                    active: true,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('new-invite-code').value = '';
                await loadInviteCodes();
                alert('✅ 邀请码生成成功！');
            } catch (e) {
                alert('❌ 生成失败：' + e.message);
            }
        }

        async function revokeInviteCode(code) {
            if (confirm('确定要撤销该邀请码吗？')) {
                await db.collection('inviteCodes').doc(code).update({ active: false });
                await loadInviteCodes();
            }
        }

        // ============== Firebase数据操作 ==============
        async function loadUserData() {
            if (!currentUser) return;
            
            // 加载作品
            const novelsSnapshot = await db.collection('users').doc(currentUser.uid).collection('novels').get();
            novelList = [];
            novelsSnapshot.forEach(doc => {
                novelList.push({ ...doc.data(), id: doc.id });
            });
            
            // 加载类型
            const typesSnapshot = await db.collection('users').doc(currentUser.uid).collection('config').doc('types').get();
            if (typesSnapshot.exists) {
                typeList = typesSnapshot.data().list || ['追妻火葬场', '世情爽文'];
            }
            
            // 渲染
            renderTypeButtons();
            renderTypeSelect();
            renderPlatformButtons();
            renderCards();
        }

        async function saveNovel() {
            const id = document.getElementById('data-id').value;
            let coverUrl = document.getElementById('cover').value;
            
            // 如果有文件上传，直接使用Base64
            const fileInput = document.getElementById('cover-file');
            if (fileInput.files.length > 0 && currentUser) {
                const file = fileInput.files[0];
                coverUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }
            
            const data = {
                name: document.getElementById('name').value,
                type: document.getElementById('type').value,
                cover: coverUrl,
                platform: document.getElementById('platform').value,
                price: document.getElementById('price').value,
                finishDate: document.getElementById('finish-date').value,
                desc: document.getElementById('desc').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (id && currentUser) {
                await db.collection('users').doc(currentUser.uid).collection('novels').doc(id).set(data, { merge: true });
                const index = novelList.findIndex(n => n.id === id);
                if (index !== -1) novelList[index] = { ...data, id };
            } else if (currentUser) {
                const docRef = await db.collection('users').doc(currentUser.uid).collection('novels').add(data);
                novelList.push({ ...data, id: docRef.id });
            } else {
                alert('请先登录！');
                return;
            }

            renderPlatformButtons();
            renderCards();
            closeModal();
        }

        async function editNovel(index) {
            const item = novelList[index];
            document.getElementById('data-id').value = item.id || '';
            document.getElementById('name').value = item.name;
            document.getElementById('type').value = item.type;
            document.getElementById('cover').value = item.cover || '';
            document.getElementById('cover-file').value = '';
            document.getElementById('platform').value = item.platform;
            document.getElementById('price').value = item.price;
            document.getElementById('finish-date').value = item.finishDate || '';
            document.getElementById('desc').value = item.desc;
            document.getElementById('modal-title').innerText = '编辑小说';
            
            if (item.cover) {
                document.getElementById('preview-cover-img').src = item.cover;
                document.getElementById('cover-preview').style.display = 'block';
            } else {
                document.getElementById('cover-preview').style.display = 'none';
            }
            
            modal.style.display = 'flex';
        }

        async function deleteNovel(index) {
            if (confirm('确定删除该小说档案？') && currentUser) {
                const item = novelList[index];
                await db.collection('users').doc(currentUser.uid).collection('novels').doc(item.id).delete();
                novelList.splice(index, 1);
                renderPlatformButtons();
                renderCards();
            }
        }

        async function addType() {
            const name = document.getElementById('new-type-name').value.trim();
            if (name && !typeList.includes(name)) {
                typeList.push(name);
                if (currentUser) {
                    await db.collection('users').doc(currentUser.uid).collection('config').doc('types').set({ list: typeList });
                }
                renderTypeButtons();
                renderTypeSelect();
                renderTypeList();
                document.getElementById('new-type-name').value = '';
            }
        }

        async function updateType(index) {
            const newName = document.getElementById(`type-${index}`).value.trim();
            if (newName) {
                typeList[index] = newName;
                if (currentUser) {
                    await db.collection('users').doc(currentUser.uid).collection('config').doc('types').set({ list: typeList });
                }
                renderTypeButtons();
                renderTypeSelect();
            }
        }

        async function deleteType(index) {
            if (confirm('确定删除该类型？')) {
                typeList.splice(index, 1);
                if (currentUser) {
                    await db.collection('users').doc(currentUser.uid).collection('config').doc('types').set({ list: typeList });
                }
                renderTypeButtons();
                renderTypeSelect();
                renderTypeList();
            }
        }

        // ============== 图片上传 ==============
        function handleCoverUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > 2 * 1024 * 1024) {
                alert('⚠️ 图片较大，上传可能需要一些时间...');
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview-cover-img').src = e.target.result;
                document.getElementById('cover-preview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        // ============== 分享功能 ==============
        async function openShareModal() {
            if (!currentUser) {
                alert('请先登录！');
                return;
            }
            
            // 保存分享链接到用户配置
            const shareId = currentUser.uid;
            const shareUrl = `${window.location.origin}${window.location.pathname}?share=${shareId}`;
            
            document.getElementById('share-link').value = shareUrl;
            shareModal.style.display = 'flex';
        }

        function closeShareModal() {
            shareModal.style.display = 'none';
            document.getElementById('qrcode-container').style.display = 'none';
            document.getElementById('qrcode').innerHTML = '';
        }

        function copyShareLink() {
            const input = document.getElementById('share-link');
            input.select();
            document.execCommand('copy');
            alert('✅ 链接已复制到剪贴板！');
        }

        function showQRCode() {
            const link = document.getElementById('share-link').value;
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, {
                text: link,
                width: 200,
                height: 200,
                colorDark: '#e4b4b4',
                colorLight: '#1a1a1a'
            });
            document.getElementById('qrcode-container').style.display = 'block';
        }

        function saveQRCode() {
            const canvas = document.querySelector('#qrcode canvas');
            const link = document.createElement('a');
            link.download = 'portfolio-qrcode.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        async function loadShareData() {
            const urlParams = new URLSearchParams(window.location.search);
            const shareId = urlParams.get('share');
            
            if (shareId) {
                try {
                    // 加载被分享用户的数据
                    const novelsSnapshot = await db.collection('users').doc(shareId).collection('novels').get();
                    novelList = [];
                    novelsSnapshot.forEach(doc => {
                        novelList.push({ ...doc.data(), id: doc.id });
                    });
                    
                    const typesSnapshot = await db.collection('users').doc(shareId).collection('config').doc('types').get();
                    if (typesSnapshot.exists) {
                        typeList = typesSnapshot.data().list || ['追妻火葬场', '世情爽文'];
                    }
                    
                    isViewOnlyMode = true;
                    showSharedBadge();
                    hideEditButtons();
                    
                    return true;
                } catch (e) {
                    console.error('加载分享数据失败', e);
                }
            }
            return false;
        }

        function showSharedBadge() {
            const container = document.getElementById('shared-badge-container');
            container.innerHTML = '<div class="shared-badge">🌹 正在查看分享的作品集</div>';
        }

        function hideEditButtons() {
            document.querySelector('.add-btn').style.display = 'none';
            document.querySelector('.share-btn').style.display = 'none';
            const typeButtons = document.querySelector('[onclick="openTypeManager()"]');
            if (typeButtons) typeButtons.style.display = 'none';
        }

        // ============== 原有UI功能 ==============
        function renderTypeButtons() {
            const container = document.getElementById('type-buttons');
            container.innerHTML = typeList.map(type => 
                `<button class="filter-btn" data-filter-type="type" onclick="filterCards('type', '${type}')">${type}</button>`
            ).join('');
        }

        function renderTypeSelect() {
            const select = document.getElementById('type');
            select.innerHTML = typeList.map(type => `<option value="${type}">${type}</option>`).join('');
        }

        function getPlatformList() {
            const platforms = new Set();
            novelList.forEach(novel => {
                if (novel.platform) {
                    platforms.add(novel.platform);
                }
            });
            return Array.from(platforms);
        }

        function renderPlatformButtons() {
            const container = document.getElementById('platform-buttons');
            const platforms = getPlatformList();
            container.innerHTML = platforms.map(platform => 
                `<button class="filter-btn" data-filter-type="platform" onclick="filterCards('platform', '${platform}')">${platform}</button>`
            ).join('');
        }

        function openTypeManager() {
            renderTypeList();
            typeModal.style.display = 'flex';
        }

        function closeTypeManager() {
            typeModal.style.display = 'none';
        }

        function renderTypeList() {
            const container = document.getElementById('type-list');
            container.innerHTML = typeList.map((type, index) => `
                <div class="type-item">
                    <input type="text" value="${type}" id="type-${index}">
                    <button class="btn btn-read" onclick="updateType(${index})">保存</button>
                    <button class="btn btn-delete" onclick="deleteType(${index})">删除</button>
                </div>
            `).join('');
        }

        function filterCards(filterType, value) {
            if (filterType === 'type') {
                currentTypeFilter = value;
            } else if (filterType === 'platform') {
                currentPlatformFilter = value;
            }
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.getAttribute('data-filter-type') === filterType) {
                    btn.classList.remove('active');
                }
            });
            event.target.classList.add('active');
            
            renderCards();
        }

        function waterfallLayout() {
            const cards = cardList.querySelectorAll('.novel-card');
            if (cards.length === 0) return;

            const gap = 32;
            const columnWidth = (cardList.offsetWidth - gap * 2) / 3;
            let heights = [0, 0, 0];

            cards.forEach((card, index) => {
                const column = heights.indexOf(Math.min(...heights));
                const randomOffset = (Math.random() - 0.5) * 8;
                const top = heights[column] + randomOffset;
                const left = column * (columnWidth + gap);

                card.style.top = `${top}px`;
                card.style.left = `${left}px`;
                card.style.width = `${columnWidth}px`;

                heights[column] += card.offsetHeight + gap;
            });

            cardList.style.height = `${Math.max(...heights)}px`;
        }

        function animateCardsIn() {
            const cards = cardList.querySelectorAll('.novel-card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.classList.add('visible');
                }, index * 120);
            });
        }

        function openModal() {
            document.getElementById('data-id').value = '';
            document.getElementById('name').value = '';
            document.getElementById('type').value = typeList[0] || '';
            document.getElementById('cover').value = '';
            document.getElementById('cover-file').value = '';
            document.getElementById('platform').value = '';
            document.getElementById('price').value = '';
            document.getElementById('finish-date').value = '';
            document.getElementById('desc').value = '';
            document.getElementById('modal-title').innerText = '新增小说';
            document.getElementById('cover-preview').style.display = 'none';
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function switchTheme(theme) {
            document.documentElement.removeAttribute('data-theme');
            if (theme !== 'rose') {
                document.documentElement.setAttribute('data-theme', theme);
            }
            
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.theme-btn.${theme}`).classList.add('active');
            
            localStorage.setItem('roseTheme', theme);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('roseTheme') || 'rose';
            switchTheme(savedTheme);
        }

        function searchNovels() {
            currentSearchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            renderCards();
        }

        function openImagePreview(src) {
            const modal = document.getElementById('image-preview-modal');
            const img = document.getElementById('preview-image');
            img.src = src;
            modal.style.display = 'flex';
        }

        function closeImagePreview() {
            document.getElementById('image-preview-modal').style.display = 'none';
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function initBackToTop() {
            const backToTopBtn = document.getElementById('back-to-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopBtn.classList.add('visible');
                } else {
                    backToTopBtn.classList.remove('visible');
                }
            });
        }

        function updateStats() {
            document.getElementById('stat-number').textContent = novelList.length;
            const platforms = getPlatformList();
            document.getElementById('stat-platforms').textContent = platforms.length;
        }

        function renderCards() {
            cardList.innerHTML = '';
            
            let listWithIndex = novelList.map((item, index) => ({ ...item, originalIndex: index }));
            
            if (currentTypeFilter !== 'all') {
                listWithIndex = listWithIndex.filter(item => item.type === currentTypeFilter);
            }
            
            if (currentPlatformFilter !== 'all') {
                listWithIndex = listWithIndex.filter(item => item.platform === currentPlatformFilter);
            }
            
            if (currentSearchQuery) {
                listWithIndex = listWithIndex.filter(item => 
                    item.name.toLowerCase().includes(currentSearchQuery) || 
                    item.desc.toLowerCase().includes(currentSearchQuery) ||
                    item.platform.toLowerCase().includes(currentSearchQuery)
                );
            }
            
            listWithIndex.sort((a, b) => {
                if (!a.finishDate && !b.finishDate) return 0;
                if (!a.finishDate) return 1;
                if (!b.finishDate) return -1;
                return new Date(b.finishDate) - new Date(a.finishDate);
            });

            if (listWithIndex.length === 0) {
                cardList.innerHTML = '<div class="empty">暂无该分类作品</div>';
                cardList.style.height = 'auto';
                updateStats();
                return;
            }

            listWithIndex.forEach((item, index) => {
                const realIndex = item.originalIndex;
                const card = document.createElement('div');
                card.className = 'novel-card';
                
                let coverHtml;
                if (item.cover) {
                    coverHtml = `<div class="card-cover" style="cursor: pointer;" onclick="openImagePreview('${item.cover}')">
                        <img src="${item.cover}" onerror="this.parentElement.innerHTML='<div class=\\'no-cover\\'>🌹</div>'">
                    </div>`;
                } else {
                    coverHtml = '<div class="card-cover"><div class="no-cover">🌹</div></div>';
                }
                
                let finishDateHtml = item.finishDate ? `<span><strong>完结：</strong>${item.finishDate}</span>` : '';
                
                let buttonsHtml;
                if (isViewOnlyMode) {
                    buttonsHtml = '';
                } else {
                    buttonsHtml = `
                        <div class="card-buttons">
                            <button class="btn btn-edit" onclick="editNovel(${realIndex})">编辑</button>
                            <button class="btn btn-delete" onclick="deleteNovel(${realIndex})">删除</button>
                        </div>
                    `;
                }
                
                card.innerHTML = `
                    ${coverHtml}
                    <h3 class="card-title">${item.name}</h3>
                    <div class="card-tag">${item.type}</div>
                    <div class="card-meta">
                        <span><strong>平台：</strong>${item.platform}</span>
                        <span><strong>售价：</strong>¥${item.price}</span>
                        ${finishDateHtml}
                    </div>
                    <div class="card-desc">${item.desc}</div>
                    ${buttonsHtml}
                `;
                cardList.appendChild(card);
            });

            const images = cardList.querySelectorAll('img');
            let loadedCount = 0;
            const checkAllLoaded = () => {
                loadedCount++;
                if (loadedCount >= images.length) {
                    waterfallLayout();
                    setTimeout(animateCardsIn, 50);
                }
            };

            if (images.length === 0) {
                waterfallLayout();
                setTimeout(animateCardsIn, 50);
            } else {
                images.forEach(img => {
                    if (img.complete) {
                        checkAllLoaded();
                    } else {
                        img.onload = checkAllLoaded;
                        img.onerror = checkAllLoaded;
                    }
                });
            }
            
            updateStats();
        }

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                waterfallLayout();
            }, 200);
        });

        // ============== 主初始化 ==============
        window.onload = async function() {
            createPetals();
            createStars();
            createDynamicStars();
            initMouseFollower();
            hideLoadingBar();
            loadTheme();
            initBackToTop();
            
            // 先检查是否是分享模式
            const isShareMode = await loadShareData();
            
            if (isShareMode) {
                // 分享模式，直接显示内容
                document.getElementById('main-header').style.display = 'block';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('auth-page').style.display = 'none';
                renderTypeButtons();
                renderTypeSelect();
                renderPlatformButtons();
                renderCards();
            } else {
                // 监听用户认证状态
                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        currentUser = user;
                        
                        // 检查是否是管理员
                        const userDoc = await db.collection('users').doc(user.uid).get();
                        if (userDoc.exists && userDoc.data().role === 'admin') {
                            isAdmin = true;
                        }
                        
                        updateUserInfoUI();
                        document.getElementById('main-header').style.display = 'block';
                        document.getElementById('main-content').style.display = 'block';
                        document.getElementById('auth-page').style.display = 'none';
                        
                        await loadUserData();
                    } else {
                        currentUser = null;
                        isAdmin = false;
                        updateUserInfoUI();
                        document.getElementById('main-header').style.display = 'none';
                        document.getElementById('main-content').style.display = 'none';
                        document.getElementById('auth-page').style.display = 'block';
                    }
                });
            }
        };
    </script>
</body>
</html>
